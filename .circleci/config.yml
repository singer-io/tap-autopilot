version: 2
jobs:
  build:
    docker:
      - image: 218546966473.dkr.ecr.us-east-1.amazonaws.com/circle-ci:stitch-tap-tester-uv
    steps:
      - checkout
      - run:
          name: 'Setup virtual env'
          command: |
            uv venv --python 3.9 /usr/local/share/virtualenvs/tap-autopilot
            source /usr/local/share/virtualenvs/tap-autopilot/bin/activate
            uv pip install .[dev]
            uv pip install pylint
      - run:
          name: 'pylint'
          command: |
            source /usr/local/share/virtualenvs/tap-autopilot/bin/activate
            pylint tap_autopilot -d C,W,consider-using-from-import
      - run:
          name: 'JSON Validator'
          command: |
            source /usr/local/share/virtualenvs/tap-tester/bin/activate
            stitch-validate-json tap_autopilot/schemas/*.json

workflows:
  version: 2
  commit:
    jobs:
      - build:
          context: circleci-user
  build_daily:
    triggers:
      - schedule:
          cron: "0 0 * * *"
          filters:
            branches:
              only:
                - master
    jobs:
      - build:
          context: circleci-user
